services:
  app:
    image: ttungbmt/ots-maps-frontend:cong-dev
    build:
      context: .
      dockerfile: ./Dockerfile
      target: development
    ports:
      - "${APP_HTTP_PORT:-3000}:3000"
    volumes:
      - .:/home/node/app
      - /home/node/app/node_modules
  traefik:
    image: traefik:v3.1
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    command:
      - --configFile=/etc/traefik/traefik.yml
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
      - ./traefik/dynamic:/etc/traefik/dynamic

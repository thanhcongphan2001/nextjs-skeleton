services:
    app:
        image: ttungbmt/ots-maps-frontend:${VITE_APP_VERSION}
        build:
            context: .
            dockerfile: ./docker/Dockerfile
            target: deploy
            args:
                - ENV_FILE=.env.production
        volumes:
            - ./docker/default.conf:/etc/nginx/conf.d/default.conf
        ports:
            - '${APP_HTTP_PORT:-80}:80'
            - '${APP_HTTPS_PORT:-443}:443'
